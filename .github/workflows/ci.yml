name: Offline validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install project and development dependencies
        run: python -m pip install ".[dev]"
      - name: Record exact tested revision and environment
        if: always()
        run: python scripts/ci_metadata.py
      - name: Dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Offline Python and MCP protocol tests
        run: python -m pytest -q -m "not live" --junitxml=ci-results/tests.xml
      - name: Browser source syntax
        run: node --check src/uk_data_mcp/web/app.js
      - name: Browser validation unit tests (synthetic DOM)
        run: node --test tests/frontend/report-validation.test.cjs
      - name: Build distributions
        run: python -m build
      - name: Verify packaged code and browser resources
        run: python scripts/check_wheel.py
      - name: Retain commit-linked validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 14
