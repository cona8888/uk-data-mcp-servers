name: One-off six-perspective model review
on:
  workflow_dispatch:
  push:
    branches: ['review/civil-readiness-2026-11-02']
    paths: ['review/agents.py', '.github/workflows/stakeholder-agents.yml']
permissions:
  contents: read
jobs:
  independent-contexts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -q torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -q transformers==4.56.2 safetensors huggingface-hub==0.34.4
      - name: Run six independent read-only review contexts on this runner
        env:
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python review/agents.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: six-role-model-review
          path: role-reviews.json
          retention-days: 30
