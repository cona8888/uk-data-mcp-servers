name: Civil evidence integrity acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/uk_data_mcp/corridor*'
      - 'src/uk_data_mcp/jurisdiction.py'
      - 'src/uk_data_mcp/cache_integrity.py'
      - 'src/uk_data_mcp/utility_handoff.py'
      - 'src/uk_data_mcp/civil_coverage.py'
      - 'scripts/check_evidence_integrity.py'
      - '.github/workflows/evidence-integrity.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Record exact source tree
        run: |
          mkdir -p integrity-evidence
          git ls-tree -r HEAD > integrity-evidence/tree.txt
          git rev-parse HEAD > integrity-evidence/commit.txt
      - run: python -m pip install '.[dev]'
      - name: Stakeholder regression controls
        run: python -m pytest -q tests/test_evidence_integrity.py --junitxml=integrity-evidence/regressions.xml
      - name: Live coverage checks and independent collision comparison via MCP
        run: python scripts/check_evidence_integrity.py
      - name: Verify schema-2 caches using official published releases
        run: |
          python scripts/check_civil_sources.py
          cp civil-validation.json integrity-evidence/civil-validation.json
      - name: Render validated evidence map
        run: python scripts/corridor_view.py integrity-evidence/digbeth.json integrity-evidence/digbeth-map.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: civil-evidence-integrity-${{ github.sha }}
          path: integrity-evidence/
          retention-days: 30
