name: Public provider smoke check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/public-data-smoke.yml']
permissions:
  contents: read
jobs:
  check:
    # Eight bounded public queries, including cross-listed historical file metadata.
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Eight read-only public API checks
        run: python scripts/smoke_public_profile.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-data-smoke-${{ github.sha }}
          path: public-smoke.json
          retention-days: 14
