name: Corridor source check
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/uk_data_mcp/corridor*'
      - 'scripts/*corridor*.py'
      - '.github/workflows/corridor.yml'
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Identify published layers and available fields
        run: python scripts/inspect_corridor_sources.py
