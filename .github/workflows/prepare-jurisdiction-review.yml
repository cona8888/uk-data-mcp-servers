name: Prepare jurisdiction reference for review
on:
  push:
    branches: ['build/country-reference-20261102']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: python -m pip install -q shapely==2.1.2 pyshp==2.3.1 httpx==0.28.1
      - run: mkdir output && git archive -o output/source.zip HEAD && python scripts/build_country_reference.py output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: reference-and-source, path: output/, retention-days: 5}
