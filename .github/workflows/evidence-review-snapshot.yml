name: Evidence review source snapshot
on:
  workflow_dispatch:
  push:
    branches: ['fix/civil-evidence-integrity']
    paths: ['.github/workflows/evidence-review-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Retain exact tracked source for isolated regression testing
        run: |
          mkdir -p review-snapshot
          git archive --format=zip HEAD -o review-snapshot/source.zip
          git rev-parse HEAD > review-snapshot/commit.txt
          git ls-tree -r HEAD > review-snapshot/tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-review-source
          path: review-snapshot/
          retention-days: 7
