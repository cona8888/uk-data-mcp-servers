<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="418" viewBox="0 0 1280 418" role="img" aria-labelledby="title desc"><title id="title">How Groundwork works</title><desc id="desc">Define a location and works, gather cited public evidence, review record relevance and GI gaps, then save the study.</desc><rect x="0" y="0" width="1280" height="418" rx="24" fill="#183B42"/><text x="44" y="49" fill="#A2DBCC" font-size="16" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">GROUNDWORK</text><text x="44" y="99" fill="white" font-size="34" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">From a site question to a review plan</text><rect x="44" y="133" width="280" height="205" rx="15" fill="white"/><text x="64" y="167" fill="#087F70" font-size="15" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">01</text><text x="64" y="208" fill="#17343A" font-size="30" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Define</text><text x="64" y="241" fill="#087F70" font-size="15" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Location and proposed works</text><text x="64" y="277" fill="#536B70" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Use an explicit search point.</text><text x="64" y="301" fill="#536B70" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Keep the project scope clear.</text><path d="M 330 230 h 11 m -5 -5 l 5 5 -5 5" fill="none" stroke="#A2DBCC" stroke-width="2"/><rect x="348" y="133" width="280" height="205" rx="15" fill="white"/><text x="368" y="167" fill="#087F70" font-size="15" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">02</text><text x="368" y="208" fill="#17343A" font-size="30" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Gather</text><text x="368" y="241" fill="#087F70" font-size="15" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Cited public evidence</text><text x="368" y="277" fill="#536B70" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Geology and record indexes.</text><text x="368" y="301" fill="#536B70" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Dates, licences and coverage.</text><path d="M 634 230 h 11 m -5 -5 l 5 5 -5 5" fill="none" stroke="#A2DBCC" stroke-width="2"/><rect x="652" y="133" width="280" height="205" rx="15" fill="white"/><text x="672" y="167" fill="#087F70" font-size="15" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">03</text><text x="672" y="208" fill="#17343A" font-size="30" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Review</text><text x="672" y="241" fill="#087F70" font-size="15" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Records and evidence gaps</text><text x="672" y="277" fill="#536B70" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Check original-record relevance.</text><text x="672" y="301" fill="#536B70" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Add notes and track GI gaps.</text><path d="M 938 230 h 11 m -5 -5 l 5 5 -5 5" fill="none" stroke="#A2DBCC" stroke-width="2"/><rect x="956" y="133" width="280" height="205" rx="15" fill="white"/><text x="976" y="167" fill="#087F70" font-size="15" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">04</text><text x="976" y="208" fill="#17343A" font-size="30" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Save</text><text x="976" y="241" fill="#087F70" font-size="15" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A study you can return to</text><text x="976" y="277" fill="#536B70" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Editable JSON workspace.</text><text x="976" y="301" fill="#536B70" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Printable report and registers.</text><text x="44" y="381" fill="#D2E8DF" font-size="18" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Keep source evidence visible. Use professional judgement before design or excavation.</text></svg>
