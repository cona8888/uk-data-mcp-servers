<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">Leeds small-house example</title><desc id="desc">Illustrated example using the saved Leeds workspace: 20 index candidates, 12 open review tasks and seven unknown design or check values. The house is hypothetical, not an actual parcel or design.</desc><rect x="0" y="0" width="1280" height="640" rx="24" fill="#F4F7F4"/><text x="44" y="45" fill="#087F70" font-size="15" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">SAVED EXAMPLE  /  PUBLIC EVIDENCE: 29 OCTOBER 2026</text><text x="44" y="96" fill="#17343A" font-size="38" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A small house in Leeds</text><text x="44" y="130" fill="#536B70" font-size="21" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Hypothetical project: two storeys, around 100 m², no basement</text><rect x="44" y="166" width="325" height="345" rx="18" fill="#183B42"/><path d="M 91 305 L 205 219 L 319 305" stroke="#9BDFCD" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M 111 294 V 432 H 300 V 294" stroke="white" stroke-width="6" fill="none"/><rect x="139" y="318" width="40" height="35" rx="3" fill="#9BDFCD"/><rect x="231" y="318" width="40" height="35" rx="3" fill="#9BDFCD"/><rect x="139" y="379" width="40" height="34" rx="3" fill="#9BDFCD"/><rect x="231" y="377" width="39" height="55" rx="3" fill="#F1CB86"/><path d="M 86 448 H 326" stroke="#8EB4B1" stroke-width="3"/><text x="206" y="485" fill="#D2E8DF" font-size="15" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Illustration, not a site plan</text><rect x="397" y="166" width="259" height="170" rx="14" fill="white" stroke="#D6E3DD" stroke-width="1"/><text x="417" y="229" fill="#087F70" font-size="49" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">20</text><text x="417" y="270" fill="#17343A" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Index candidates</text><text x="417" y="304" fill="#536B70" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Originals need review</text><rect x="677" y="166" width="259" height="170" rx="14" fill="white" stroke="#D6E3DD" stroke-width="1"/><text x="697" y="229" fill="#087F70" font-size="49" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">12</text><text x="697" y="270" fill="#17343A" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Open review tasks</text><text x="697" y="304" fill="#536B70" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Questions, not hazards</text><rect x="957" y="166" width="259" height="170" rx="14" fill="white" stroke="#D6E3DD" stroke-width="1"/><text x="977" y="229" fill="#087F70" font-size="49" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">7</text><text x="977" y="270" fill="#17343A" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Values still unknown</text><text x="977" y="304" fill="#536B70" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Design / site checks</text><text x="397" y="380" fill="#17343A" font-size="25" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">What comes next?</text><circle cx="407" cy="413" r="5" fill="#087F70"/><text x="425" y="419" fill="#17343A" font-size="19" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Confirm the actual site, loads, layout and movement criteria.</text><circle cx="407" cy="450" r="5" fill="#087F70"/><text x="425" y="456" fill="#17343A" font-size="19" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Review original records, relevance and possible duplicates.</text><circle cx="407" cy="487" r="5" fill="#087F70"/><text x="425" y="493" fill="#17343A" font-size="19" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Resolve ground-model and groundwater gaps before design.</text><rect x="44" y="541" width="1192" height="65" rx="12" fill="#E3EEE7"/><text x="63" y="567" fill="#17343A" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">20 candidates = 10 borehole-index + 10 investigation-file-index records. They are not 20 distinct holes at the site.</text><text x="63" y="590" fill="#536B70" font-size="15" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Search uses an enclosing rectangle. Records outside the requested circle remain visible. Source dates and limits stay with the study.</text></svg>
