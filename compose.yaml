services:
  uk-data-mcp:
    build: .
    image: uk-data-mcp:0.2.0
    command: ["serve", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 64
